# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: recoms.docs.buildwithfern.com # update this to {yourorg}.docs.buildwithfern.com
    # custom-domain: plantstore.dev # specify your custom domain when you are ready to go live

title: "Recoms Docs"

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  home:
    display-name: Docs
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle

navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Edit your docs
            path: docs/pages/editing-your-docs.mdx
            icon: fa-duotone fa-pen-to-square
          - page: Write content
            path: docs/pages/writing-content.mdx
            icon: fa-duotone fa-file-lines
          - page: Set up navigation
            path: docs/pages/navigation.mdx
            icon: fa-duotone fa-sitemap
          - page: Customize your docs
            path: docs/pages/customization.mdx
            icon: fa-duotone fa-palette
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
      - section: Changelog
        contents:
          - changelog: docs/changelog
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: Plant Store API
        layout:
          - section: Plants
            referenced-packages:
              - plant
            contents: []
          - section: Users
            referenced-packages:
              - user
            contents: []

navbar-links:
  - type: minimal
    text: Fork this repo
    url: https://github.com/fern-api/docs-starter
  - type: filled
    text: Dashboard
    url: https://dashboard.buildwithfern.com
  - type: github
    value: https://github.com/fern-api/fern

colors:
  accent-primary:
    dark: "#016630"
    light: "#016630"
  background:
    dark: "#0a0a0a"
    light: "#f5f5f5"
  border:
    light: "#eaeaea"
    dark: "#252525"
  header-background:
    light: "#ffffff"
    dark: "#171717"
  sidebar-background:
    light: "#ffffff"
    dark: "#171717"
  card-background:
    light: "#ffffff"
    dark: "#171717"

theme:
  page-actions: toolbar
  footer-nav: minimal

css: styles.css

metadata:
  og:dynamic: true
